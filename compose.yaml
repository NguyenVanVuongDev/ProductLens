services:
  api:
    build:
      context: .
      dockerfile: Dockerfile/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      FAISS_INDEX_PATH: /workspace/artifacts/indexes/lookbench_gallery_hnsw_m16.faiss
      PRODUCT_CATALOG_PATH: /workspace/data/lookbench/product_catalog.parquet
      DATA_ROOT: /workspace/data
    volumes:
      - ./artifacts:/workspace/artifacts:ro
      - ./data:/workspace/data:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s

  demo:
    build:
      context: .
      dockerfile: Dockerfile/Dockerfile
    command: streamlit run app/demo.py --server.address 0.0.0.0 --server.port 8501
    environment:
      API_URL: http://api:8000
      DATA_ROOT: /workspace/data
    volumes:
      - ./data:/workspace/data:ro
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy